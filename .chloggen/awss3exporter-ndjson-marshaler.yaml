# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: exporter/awss3

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: "Add an `ndjson` marshaler that writes one JSON object per line, flattening resource and scope attributes onto each log record, metric data point and span."

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [50468]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  Objects are written with a `.jsonl` extension. Attribute values keep their native JSON types, and on a key
  collision the more specific level wins (record over scope over resource). Span events and links, and sum
  temporality and monotonicity, are not preserved.

  A log body is routed by its type to exactly one field, so each key holds a stable JSON type: a string, int,
  double, bool or bytes body becomes `message`, a kvlist becomes `body`, and an array becomes `array`. Nulls are
  stripped recursively from those fields and from attributes, along with any container left empty by the
  stripping, so a null never appears in a line. Zero values are kept.

  A gauge or sum data point names its value field after the value's type -- `asInt` or `asDouble` -- for the same
  reason, so a consumer never has to inspect a value to know its type.

